aws.sns.topic-arn=${SNS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:image-events-topic}

# Expose health and info endpoints via HTTP
management.endpoints.web.exposure.include=health,info

# Show full health details (components, DB status, disk space)
management.endpoint.health.show-details=always